<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../Css/Web.css">
    <script src="../Java/web.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chinh">
        <div class="noidung">
            <div class="logo"></div>
            <p class="mot">Hehe</p>
            <p class="hai">Art</p>
        </div>
        <div class="dangnhap">
            <div class="haha">
                <p class="tren">Đăng nhập để tiếp tục hành trình sáng tạo của bạn:</p>
                <div class="input-box">
                    <input type="text" required id="email">
                    <label>Tên người dùng</label>
                </div>
                <div class="input-box">
                    <input type="password" required id="pass">
                    <label>Mật khẩu</label>
                </div>
                <input type="button" class="nut" value="Đăng nhập" onclick="myFunction()">
                <hr>
                <button class="tao" onclick="SignIn()">Đăng ký</button>
                <a href="#" class="quen">Quên Smật khẩu?</a>
            </div>
        </div>
    </div>
    <script>
       function myFunction() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;

    fetch("http://localhost:3000/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: pass
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Đăng nhập thành công!");
            window.location.href = "../Sản Phẩm cuối khóa/index.html";
        } else {
            alert(data.message);
        }
    })
    .catch(error => {
        console.error("Lỗi:", error);
    });
}
    </script>
</body>
</html>
