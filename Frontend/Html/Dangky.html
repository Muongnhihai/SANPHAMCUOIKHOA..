<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel ="stylesheet" href="../Css/Dangky.css">
    <script src="../Java/Dangky.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
      <div class="chinh">
        <div class="noidung"> 
            <div class="logo"></div>
             <p class="mot">Hehe</p>
             <p class="hai">Art</p>  
        </div>
        <div class="dangnhap">
        <div class="haha">
            <p class="tren">Đăng ký để bắt đầu hành trình sáng tạo của bạn:</p>
            <div class="input-box" >
            <input type="text" required id="email">
            <label>Tên người dùng</label>
            </div>
            <div class="input-box" >
            <input type="password" required id="pass">
            <label>Mật khẩu</label>
            </div>
            <input type="button" class="nut" value="Đăng nhập" onclick="myFunction()">
            <hr>
            <button class="tao" onclick="SignIn()"> Đăng Nhập</button>
            <button href="#" class="quen" onclick="showSupport()">Cần hỗ trợ? Nhấn vào đây</button>
        </div>
        </div>
    </div>
    <script>
        fetch('../JSON/web.json')
            .then(response => response.json())
            .then(Dangnhap => {
                const name = Dangnhap.name;
                const password = Dangnhap.pass;
                console.log(name, password);
            })
            .catch(error => console.error('Lỗi khi đọc file JSON:', error));
        function myFunction() {
            const pass= document.getElementById("pass");
            const email= document.getElementById("email");
            if(pass.value==password && email.value== name) {
                alert("Đăng nhập thành công");
                window.location.href="./Sản Phẩm cuối khóa/index.html";
            } else {
                alert("Đăng nhập thất bại");
            }
        }
        function SignIn() {
            window.location.href="./Web.html";
        }
        function showSupport() {
            window.location.href="https://www.facebook.com/muong.nhi.hai";
        }
    </script>
</body>
</html>
